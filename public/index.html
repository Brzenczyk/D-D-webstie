<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>D&D – Planowanie sesji</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>
<div class="container">
    <header style="display:flex; justify-content: space-between; align-items:center;">
        <h1>🎲 Planowanie sesji D&D</h1>
        <button id="adminBtn">Admin</button>
        <button id="logoutAdminBtn" style="margin-left:10px;">Wyloguj admina</button>

    </header>

    <section class="section">
        <h2>🧙 Twoje imię</h2>
        <input type="text" id="playerName" placeholder="Podaj swoje imię">
        <input type="email" id="playerEmail" placeholder="Podaj email (opcjonalnie)">
        <select id="playerEmoji">
            <option value="🧙">🧙 Czarnoksiężnik</option>
            <option value="🗡️">🗡️ Wojownik</option>
            <option value="🛡️">🛡️ Paladyn</option>
            <option value="🧝">🧝 Elf</option>
            <option value="🐉">🐉 Smok</option>
            <option value="⚡">⚡ Czarodziej</option>
            <option value="🏹">🏹 Łucznik</option>
            <option value="🪄">🪄 Mag</option>
            <option value="🦸">🦸 Bohater</option>
            <option value="🧟">🧟 Zombie</option>
        </select>
        <button id="saveName">Zapisz</button>
        <p id="welcome"></p>
    </section>

    <section class="section">
        <h2>👥 Wybierz gracza</h2>
        <select id="playerSelect">
            <option value="">— wybierz gracza —</option>
        </select>
    </section>

    <section class="section">
        <h2>📅 Zaproponuj termin</h2>
        <input type="date" id="dateInput">
        <button id="addDate">Dodaj propozycję</button>
    </section>

    <section class="section">
        <h2>⚔️ Propozycje terminów</h2>
        <ul id="dateList"></ul>
    </section>
</div>

<!-- Modal admina -->
<div id="adminModal" class="modal" style="display:none;">
    <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>
        <h3>Panel admina</h3>
        <input type="password" id="adminPinInput" placeholder="Wpisz PIN admina">
        <button id="loginAdminBtn">Zaloguj</button>
        <p id="adminError" style="color:red;"></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
